name: astrbot_plugin_tsugu
display_name: Tsugu Bang Dream! 游戏助手
desc: BanG Dream! 游戏助手插件，支持查曲/查卡/查角色/查活动/查卡池/抽卡模拟/谱面查询/分数表/活动试炼/档线查询/车牌列表/车牌转发/玩家绑定等 26 个命令。v1.3.0 新增白名单模式/命令别名/@唤醒开关/回复装饰/唤醒前缀/车牌转发
short_desc: BanG Dream! 少女乐团派对全能助手，26 个命令覆盖曲目/卡牌/活动/车牌/玩家
version: 1.3.0
author: QClaw
repo: https://github.com/buruqu/astrbot_plugin_tsugu
astrbot_version: ">=4.16.0"
support_platforms:
  - aiocqhttp
  - qq_official_webhook
commands:
  - name: 查曲
    desc: 根据关键词或曲目ID查询曲目信息
  - name: 查卡
    desc: 根据关键词或卡牌ID查询卡片信息
  - name: 查卡面
    desc: 根据卡片ID查询卡片插画
  - name: 查角色
    desc: 根据关键词或角色ID查询角色信息
  - name: 查活动
    desc: 根据关键词或活动ID查询活动信息
  - name: 查卡池
    desc: 根据卡池ID查询卡池信息
  - name: 抽卡模拟
    desc: 模拟抽卡
  - name: 查谱面
    desc: 根据曲目ID与难度查询谱面信息
  - name: 分数表
    desc: 查询指定服务器的歌曲分数表
  - name: 查试炼
    desc: 查询当前服务器当前活动试炼信息
  - name: ycx
    desc: 查询指定档位的预测线
  - name: ycxall
    desc: 查询所有档位的预测线
  - name: lsycx
    desc: 查询指定档位的历史档线数据
  - name: 车牌列表
    desc: 获取所有车牌
  - name: 开启车牌转发
    desc: 开启后发送的车牌自动提交到公共频道
  - name: 关闭车牌转发
    desc: 关闭车牌转发功能
  - name: 查玩家
    desc: 查询指定ID玩家的信息
  - name: 玩家绑定
    desc: 开始玩家数据绑定流程
  - name: 绑定
    desc: 发送 绑定<玩家ID> 完成绑定验证
  - name: 取消绑定
    desc: 取消正在进行的绑定流程
  - name: 解除绑定
    desc: 开始解除绑定流程
  - name: 玩家状态
    desc: 查询自己的玩家状态
  - name: 绑定列表
    desc: 查看已绑定的玩家列表
  - name: 主服务器
    desc: 设置主服务器
  - name: 显示服务器
    desc: 设置默认显示的服务器列表
  - name: 选择绑定
    desc: 切换默认使用的绑定玩家
  - name: 随机曲目
    desc: 随机一首曲目
